[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formata-3"
version = "0.1.0"
description = "Formata 3.0 legal deadline and limitation management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise[brotli]>=6.9",
    "cryptography>=50,<51",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
